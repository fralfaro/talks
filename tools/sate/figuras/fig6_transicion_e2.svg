<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Transiciones de estado entre semestre 1 y semestre 2</title>
  <desc id="desc">Barras apiladas muestran empeora, mejora y se mantiene por cohorte. La cohorte 2026 tiene un patrón anómalo asociado al cierre parcial del semestre 2.</desc>
  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="70" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183b56">E2: transición de estado entre S1 y S2</text>
  <text x="70" y="96" font-family="Arial, sans-serif" font-size="22" fill="#55667c">Reglas auditables sobre créditos, ramos reprobados, científicos y VTR · porcentaje por cohorte</text>

  <g font-family="Arial, sans-serif" font-size="19" fill="#6b7785">
    <text x="340" y="153">0%</text><text x="605" y="153">25%</text><text x="870" y="153">50%</text><text x="1135" y="153">75%</text><text x="1390" y="153">100%</text>
  </g>
  <g stroke="#dce5ee" stroke-width="2">
    <line x1="350" y1="165" x2="350" y2="630"/><line x1="615" y1="165" x2="615" y2="630"/><line x1="880" y1="165" x2="880" y2="630"/><line x1="1145" y1="165" x2="1145" y2="630"/><line x1="1410" y1="165" x2="1410" y2="630"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183b56" text-anchor="end">
    <text x="315" y="255">2023</text><text x="315" y="365">2024</text><text x="315" y="475">2025</text><text x="315" y="585">2026</text>
  </g>
  <!-- 2023 -->
  <g><rect x="350" y="215" width="492.90" height="54" fill="#e94b3c"/><rect x="842.90" y="215" width="118.72" height="54" fill="#2e9f6b"/><rect x="961.62" y="215" width="448.38" height="54" fill="#9aa8ac"/><g font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle"><text x="596" y="249">46.5% empeora</text><text x="902" y="249">11.2% mejora</text><text x="1186" y="249">42.3% se mantiene</text></g></g>
  <!-- 2024 -->
  <g><rect x="350" y="325" width="496.08" height="54" fill="#e94b3c"/><rect x="846.08" y="325" width="104.94" height="54" fill="#2e9f6b"/><rect x="951.02" y="325" width="458.98" height="54" fill="#9aa8ac"/><g font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle"><text x="598" y="359">46.8% empeora</text><text x="899" y="359">9.9% mejora</text><text x="1180" y="359">43.3% se mantiene</text></g></g>
  <!-- 2025 -->
  <g><rect x="350" y="435" width="443.14" height="54" fill="#e94b3c"/><rect x="793.14" y="435" width="116.60" height="54" fill="#2e9f6b"/><rect x="909.74" y="435" width="500.26" height="54" fill="#9aa8ac"/><g font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle"><text x="572" y="469">41.9% empeora</text><text x="851" y="469">11.0% mejora</text><text x="1160" y="469">47.1% se mantiene</text></g></g>
  <!-- 2026 -->
  <g><rect x="350" y="545" width="898.94" height="54" fill="#e94b3c"/><rect x="1248.94" y="545" width="4.24" height="54" fill="#2e9f6b"/><rect x="1253.18" y="545" width="156.82" height="54" fill="#9aa8ac"/><g font-family="Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle"><text x="799" y="579">84.9% empeora</text><text x="1331" y="579">14.7% se mantiene</text></g></g>

  <rect x="350" y="665" width="1060" height="86" rx="12" fill="#fff8ed" stroke="#ef9b3e" stroke-width="3"/>
  <text x="380" y="700" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a4501a">Advertencia de calidad para 2026</text>
  <text x="380" y="731" font-family="Arial, sans-serif" font-size="20" fill="#6b4b35">El 84.9% no debe leerse como deterioro real: bloquear transición hasta que S2 esté cerrado y validado.</text>

  <g font-family="Arial, sans-serif" font-size="21" fill="#183b56">
    <rect x="425" y="775" width="24" height="24" fill="#e94b3c"/><text x="460" y="795">Empeora</text>
    <rect x="700" y="775" width="24" height="24" fill="#2e9f6b"/><text x="735" y="795">Mejora</text>
    <rect x="930" y="775" width="24" height="24" fill="#9aa8ac"/><text x="965" y="795">Se mantiene</text>
  </g>
</svg>
